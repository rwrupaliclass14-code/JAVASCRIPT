<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <!--input part when product add-->
    <section class="container-fluid">
        <div class="container">
            <div class="mt-3">
                <label for="exampleFormControlInput1" class="form-label">Product Name</label>
                <input type="text" class="form-control" id="input-name">
            </div>
            <div class="mb-3">
                <label for="exampleFormControlTextarea1" class="form-label">Product Description</label>
                <textarea class="form-control" id="input-description" rows="3"></textarea>
            </div>
            <div class="mt-3">
                <label for="exampleFormControlInput1" class="form-label">Category</label>
                <input type="text" class="form-control" id="input-category">
            </div>
            <div class="mt-3">
                <label for="exampleFormControlInput1" class="form-label">Discount</label>
                <input type="text" class="form-control" id="input-discount">
            </div>
            <div class="mt-3">
                <label for="exampleFormControlInput1" class="form-label">Price</label>
                <input type="text" class="form-control" id="input-price">
            </div>
            <div class="mt-3">
                <label for="exampleFormControlInput1" class="form-label">Rating</label>
                <input type="text" class="form-control" id="input-rating">
            </div>
            <div class="mt-3 d-flex flex-column">
                <label for="exampleFormControlInput1" class="form-label">Product Photo</label>
                <input id="input-img" type="text" class="form-control" placeholder="product-url">
            </div>
            <div id="id"></div>
            <div class="mt-3 d-flex justify-content-center">
                <button id="add-product-btn" class="btn btn-primary w-50 ">Add Product</button>
            </div>
            <div class="mt-3 d-flex justify-content-center d-none">
                <button id="edit-product-btn" class="btn btn-warning w-50 ">Edit Product</button>
            </div>
        </div>
    </section>
    <hr class="my-5">
    <!---output part in table row -->
    <section class="container-fluid">
        <div class="container d-flex justify-content-between my-4">
            <div class="col-6 d-flex gap-2">
                <input id="input-search" type="text" placeholder="product name,price....." class="form-control">
                <button id="search-btn" class="btn btn-primary">Search</button>
                <button id="reset-btn" class="btn btn-danger">Reset</button>
            </div>
            <div>
                <div class="d-flex gap-4">
                    <select class="form-select" aria-label="Default select example" id="search-category">
                        <option value="all">All Category</option>
                        <option value="Food">Food</option>
                        <option value="Electronic">Electronic</option>
                        <option value="Beauty">Beauty</option>
                    </select>
                    <select class="form-select" aria-label="Default select example" id="price-filter">
                        <option>Default</option>
                        <option value="max">Heigh To Low</option>
                        <option value="min">Low To Heigh</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="container mt-2">
            <div>
                <table class="table">
                    <thead>
                        <tr>
                            <th scope="col">.</th>
                            <th scope="col">Product Photo</th>
                            <th scope="col">Product Name</th>
                            <th scope="col">category</th>
                            <th scope="col">Price</th>
                            <th scope="col">Description</th>
                            <th scope="col">Discount</th>
                            <th scope="col">Rating </th>
                            <th scope="col">Action</th>
                        </tr>
                    </thead>
                    <tbody id="product-tbody">
                        <tr>
                            <th scope="row">1</th>
                            <td>
                                <img src="" alt="product photo" height="100">
                            </td>
                            <td>Cherry Vanila</td>
                            <td>food</td>
                            <td>230</td>
                            <td>Lorem ipsum dolor sit amet consectetur.</td>
                            <td>3%</td>
                            <td>2M 🌟🌟🌟</td>
                            <td class="d-flex">
                                <button id="edit-btn" class="btn btn-warning rounded">Edit</button>
                                <button id="delete-btn" class="btn btn-danger rounded">Delete</button>
                            </td>
                        </tr>

                    </tbody>
                </table>
            </div>
        </div>
    </section>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
