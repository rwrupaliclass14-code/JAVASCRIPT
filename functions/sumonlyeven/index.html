<body>
    <script>

        //wap to sum of all digits of number 

        function print(num) {
            let sum = 0;


            for (let i = 1; i <= num; i++) {


                if (i % 2 === 0) {
                    console.log("this is even number", i);
                    sum += i;
                }
            }

            console.log("sum of even number =", sum);
        }

        print(10);


    </script>
