    <script>


        //write a program number swap using third variable with function.

        function swap(a, b) {

            let temp;

            temp = a; // temp =10
            a = b; // a = 20
            b = temp; // b = 10

            console.log(a);
            console.log(b);
        }

        swap(10, 20);
    </script>
