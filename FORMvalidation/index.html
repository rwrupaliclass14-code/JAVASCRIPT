<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <div class="form-box">
            <form action="#">

                <input id="input-name" type="text" placeholder="Enter name">
                <input id="input-email" type="email" placeholder="Enter email">
                <input id="input-number" type="phone" placeholder="Enter number">
                <input id="input-age" type="age" placeholder="Enter age">
                <button id="submit-btn" type="submit">Submit</button>

                <p id="output-name"></p>
                <p id="output-email"></p>
                <p id="output-number"></p>
                <p id="output-age"></p>
            </form>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
