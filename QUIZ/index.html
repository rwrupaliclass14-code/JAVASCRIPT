<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>My quiz app website</title>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

  <div class="container-fluid">
    <h2 class="mt-4">Kon Banega Karorpati</h2>

    <main class="container d-flex justify-content-center align-items-center">

      <!--start quiz ui design-->
      <div class="card p-4 shadow text-center" id="startScreen">
        <h2>Quiz Time!</h2>
        <p class="text-muted">Answer each question within 1 minute.</p>
        <button id="start" class="btn btn-primary w-100">Start Quiz</button>
      </div>

      <!-- quiz question or timer -->
      <div class="card p-4 shadow text-center d-none" id="quizScreen">
        <div id="timer" class="fw-bold text-danger mb-2">69-second</div>
        <h2 id="question">Question</h2>
        <div id="options"></div>
        <button id="next" class="btn btn-primary w-100 d-none">Next</button>
      </div>

      <!-- RESULT SCREEN -->
      <div class="card p-4 shadow text-center d-none" id="resultScreen" style="width: 320px;">
        <h2>Quiz Complete!</h2>
        <div id="scoreValue" class="display-5 fw-bold my-2">0 / 0</div>
        <span id="status" class="badge mb-3">-</span>
        <p id="scorePercent" class="text-muted"></p>
        <button id="restart" class="btn btn-primary w-100">Try Again</button>
      </div>

    </main>
  </div>
  <script src="script.js"></script>
</body>

</html>
