<body>
    <script>

        //wap to sum of 1 to 10 number by using while loop

        let i = 1;       // counter start 1  i=2
        let sum = 0;     // sum at 0         sum=1;

        while (i <= 10) {
            sum = sum + i; // Add the current number to the sum 0 + 1 = 1 sum, 1+2, = 3 sum
            i++;           // Move to the next number 1+1 =2 , 3
        }

        console.log(sum); // Output: 55

    </script>
</body>
