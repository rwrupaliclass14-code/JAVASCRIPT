<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />

    <style>
        .box {
            height: 300px;
            width: 300px;
        }
    </style>
</head>

<body>
    <section class="container-fluid">
        <div class="container">

            <h1>Notes</h1>

            <div class="d-flex w-100 align-items-center justify-content-center gap-3 my-3">
                <div class="w-50">
                    <input id="input-note" type="text" class="form-control" placeholder="Create new note.." />
                </div>
                <button id="input-btn" class="btn btn-primary">Create Note</button>
            </div>
            <div id="notes-box" class="row row-cols-5 g-3 mt-5 gap-3 justify-content-center">
                <div class="bg-warning px-3 py-3 rounded">
                    Lorem ipsum dolor sit, amet consectetur adipisicing elit. Pariatur
                </div>
            </div>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
