<!DOCTYPE html>

<body>
    <script>
        //wap to find maximum value from array

        let array = [1, 2, 3, 4, 5, 6, 7];
        let maximum = array[0];
        array.forEach((element) => {

            if (maximum < element) {
                maximum = element;

            }
        });
        console.log("this is a maximum value =" + maximum);

    </script>
</body>
