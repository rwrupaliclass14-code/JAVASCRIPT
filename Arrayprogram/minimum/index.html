<!DOCTYPE html>

<body>
    <script>

        //wap to program find minimum by using arrayfunction.

        let array = [1, 2, 3, 4, 5, 6, 7];
        let minimum = array[0];
        array.forEach((element) => {

            if (minimum > element) {
                minimum = element;

            }
        });
        console.log("this is a minimum value =" + minimum);

    </script>
</body>

</html>
