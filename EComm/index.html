<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>E-Comers Website</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <div class="my-2 d-flex flex-column gap-2">
            <h4>Product Listing</h4>
            <input id="id" type="hidden" />
            <input id="input-name" type="text" class="form-control" placeholder="product-name">
            <input id="input-category" type="text" class="form-control" placeholder="product-category">
            <input id="input-description" type="text" class="form-control" placeholder="Description">
            <input id="input-discount" type="text" class="form-control" placeholder="Discount">
            <input id="input-price" type="text" class="form-control" placeholder="Price">
            <input id="input-rating" type="text" class="form-control" placeholder="Rating">
            <input id="input-img" type="text" class="form-control" placeholder="product-url">

            <button id="add-product-btn" class="btn btn-primary mt-2">Add Product</button>
            <button id="edit-product-btn" class="btn btn-warning d-none">
                Edit Product
            </button>
        </div>
    </div>
    <hr>
    <div class="container d-flex gap-3 my-4">
        <div class="col-6 d-flex gap-2">
            <input id="input-search" type="text" placeholder="product name,price....." class="form-control">
            <button id="search-btn" class="btn btn-primary">Search</button>
            <button id="reset-btn" class="btn btn-primary">Reset</button>
        </div>
        <div>
            <div class="d-flex">
                <select class="form-select" aria-label="Default select example" id="search-category">
                    <option value="all">All Category</option>
                    <option value="Food">Food</option>
                    <option value="Electronic">Electronic</option>
                    <option value="Beauty">Beauty</option>
                    <option value="Cloth">Cloth</option>
                    <option value="Foot Wear">Foot Wear</option>
                </select>
                <select class="form-select" aria-label="Default select example" id="price-filter">
                    <option>Default</option>
                    <option value="max">Heigh To Low</option>
                    <option value="min">Low To Heigh</option>
                </select>
            </div>
        </div>
    </div>
    <div class="container mt-2">
        <div>
            <table class="table">
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Product Photo</th>
                        <th scope="col">Product Name</th>
                        <th scope="col">category</th>
                        <th scope="col">Price</th>
                        <th scope="col">Description</th>
                        <th scope="col">Discount</th>
                        <th scope="col">Rating</th>
                        <th scope="col">Action</th>
                    </tr>
                </thead>
                <tbody id="product-tbody">
                    <tr>
                        <th scope="row">1</th>
                        <td>
                            <img src=" https://img.forestessentialsindia.com/pub/media/catalog/product/cache/f8158826193ba5faa8b862a9bd1eb9e9/8/8/8846_advanced_sanjeevani_beauty_elixir_30g_front.png"
                                alt="product photo" height="100">
                        </td>
                        <td>Aamala Candy</td>
                        <td>food</td>
                        <td>4995.96</td>
                        <td>Lorem ipsum dolor sit amet consectetur.</td>
                        <td>10%</td>
                        <td>7.9K</td>
                        <td>
                            <button id="edit-btn" class="btn btn-warning rounded">Edit</button>
                            <button id="delete-btn" class="btn btn-danger rounded">Delete</button>
                        </td>
                    </tr>

                </tbody>
            </table>
        </div>
    </div>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
