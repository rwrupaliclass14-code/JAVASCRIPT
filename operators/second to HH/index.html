<body>
    <script>

        let second = 3665;

        let minute = Math.floor((second % 3600) / 60);

        let hour = Math.floor(second / 3600);

        second = Math.floor((second % 3600) % 60);

        console.log(hour + ":" + minute + ":" + second);

    </script>
</body>
