<body>
    <script>

        //wap to program sum of 1 to 10 by using do while.

        let i = 1;
        let sum = 0;
        do {

            sum = sum + i;
            i++;

        } while (i <= 10)
        console.log("total sum is = " + (sum));


    </script>
