<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ecommerce user website</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <!---navbar here-->
    <section class="container-fluid">
        <nav class="navbar bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand">E-commerce</a>
                <div class="d-flex gap-3">
                    <form class="d-flex" role="search">
                        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
                        <button class="btn btn-outline-success" type="submit">Search</button>
                    </form>
                    <a href="index.html" class="btn btn-outline-primary" type="submit">Back</a>

                </div>
            </div>
        </nav>
    </section>
    <!---card display jab add to card kare-->
    <section class="container-fluid">
        <div class="container d-flex flex-columun align-item-center">
            <div class="card col-7 my-4">
                <div class="card-body d-flex ">
                    <img src=" https://tartecosmetics.com/cdn/shop/files/unique__197689065540__maracuja-juicy-lip-sculptor-lipstick-_-lip-gloss-boldberry__01.jpg?v=1778007906&width=990"
                        class="card-img-top w-25" alt="...">
                    <div class="card-body">
                        <h5 class="card-title">${products.title}</h5>
                        <p class="card-text">${products.description}</p>
                        <div class="mt-2">
                            <button class="btn btn-primary text-black rounded px-3 py-1 font-bold">+</button>
                            <span>3</span>
                            <button class="btn btn-primary text-black rounded px-3 py-1 font-bold">-</button>
                        </div>
                    </div>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item">${products.category}</li>
                        <li class="list-group-item">${products.rating}</li>
                        <li class="list-group-item">${products.returnPolicy}</li>
                        <li class="list-group-item">${products.price}</li>
                    </ul>
                </div>
            </div>
        </div>
    </section>
    <script src="card.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
