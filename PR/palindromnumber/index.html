<!DOCTYPE html>
<html lang="en">

<body>
    <script>

        //wap to check palindrome number or not 

        let num = 121;
        let rev = 0;
        let temp = num;   // temp = 121

        while (num > 0) {
            let digit = num % 10;
            rev = rev * 10 + digit;
            num = Math.floor(num / 10);
        }
        if (temp == rev) {
            console.log("Palindrome Number");
        } else {
            console.log("Not Palindrome Number");
        }

    </script>
</body>

</html>
